# Build and publish cozo-lib-wasm to GitHub Releases for npm install via URL.
#
# Triggered by `wasm-v*` tags (e.g., wasm-v0.7.6).
# On workflow_dispatch, builds only unless `publish=true`.
#
# Auth: No npm token required — artifacts are served directly from GitHub Releases.
# Users install via: npm install https://github.com/cozodb/cozo/releases/download/wasm-v0.7.6/cozo-lib-wasm-0.7.6.tar.gz

name: wasm-release

on:
  push:
    tags: ["wasm-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to GitHub Release (else build only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test WASM package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: |
          cd cozo-lib-wasm
          CARGO_PROFILE_RELEASE_LTO=fat wasm-pack build --target web --release

      - name: Run integration tests
        run: cd cozo-lib-wasm && node --test tests/integration.test.mjs

      - name: Run clippy
        run: cargo clippy --manifest-path cozo-lib-wasm/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cozo-lib-wasm-pkg
          path: cozo-lib-wasm/pkg

  upload-release:
    name: Upload to GitHub Release
    needs: [build-and-test]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment: github-releases
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cozo-lib-wasm-pkg
          path: pkg

      - name: Get version from package.json
        id: version
        run: |
          VERSION="$(node -p "require('./pkg/package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Create tarball
        run: tar czvf cozo-lib-wasm-${{ steps.version.outputs.version }}.tar.gz -C pkg .

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="wasm-v$VERSION"
          case "$VERSION" in
            *-*) FLAGS=(--prerelease) ;;
            *)   FLAGS=(--latest) ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating asset."
            gh release upload "$TAG" cozo-lib-wasm-${VERSION}.tar.gz --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" --title "$TAG" "${FLAGS[@]}"
            gh release upload "$TAG" cozo-lib-wasm-${VERSION}.tar.gz
          fi
