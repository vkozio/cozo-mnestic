# Build and publish cozo-lib-wasm to GitHub Releases for npm install via URL.
#
# Triggered by `wasm-v*` tags (e.g., wasm-v0.7.6).
# On workflow_dispatch, builds only unless `publish=true`.
#
# Auth: No npm token required — artifacts are served directly from GitHub Releases.
# Users install via: npm install https://github.com/cozodb/cozo/releases/download/wasm-v0.7.6/cozo-lib-wasm-0.7.6.tar.gz

name: wasm-release

on:
  push:
    tags: ["wasm-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to GitHub Release (else build only)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # --- lint + test gate: ensure the WASM module compiles and tests pass ---
  test:
    name: test + clippy (cozo-lib-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - run: cargo build -p cozo-lib-wasm --target wasm32-unknown-unknown --verbose
      - run: cargo test -p cozo-lib-wasm --target wasm32-unknown-unknown --verbose
      - run: cargo clippy -p cozo-lib-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings

  build:
    name: Build WASM package
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM package
        run: |
          cd cozo-lib-wasm
          CARGO_PROFILE_RELEASE_LTO=fat wasm-pack build --target web --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cozo-lib-wasm-pkg
          path: cozo-lib-wasm/pkg

  upload-release:
    name: Upload to GitHub Release
    needs: [build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment: github-releases
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cozo-lib-wasm-pkg
          path: pkg

      # Guard: on a tag push, wasm-v<X.Y.Z> must match cozo-lib-wasm's package version.
      - name: Verify tag matches WASM package version
        id: ver
        run: |
          WASM_VERSION="$(python3 -c "import tomllib; print(tomllib.load(open('cozo-lib-wasm/Cargo.toml','rb'))['package']['version'])")"
          PKG_VERSION="$(node -p "require('./pkg/package.json').version")"
          echo "wasm=$WASM_VERSION" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "workflow_dispatch: no tag; WASM version is $WASM_VERSION. Skipping tag guard."
            exit 0
          fi
          TAG_VERSION="${GITHUB_REF#refs/tags/wasm-v}"
          echo "Tag:       $TAG_VERSION"
          echo "Cargo:     $WASM_VERSION"
          echo "package.json: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$WASM_VERSION" ]; then
            echo "::error::Tag wasm-v$TAG_VERSION != cozo-lib-wasm/Cargo.toml version $WASM_VERSION. Bump the manifest to match the tag before releasing."
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag wasm-v$TAG_VERSION != pkg/package.json version $PKG_VERSION. Ensure versions match."
            exit 1
          fi
          echo "Version match OK."

      - name: Create tarball
        run: tar czvf cozo-lib-wasm-${{ steps.ver.outputs.pkg }}.tar.gz -C pkg .

      - name: Extract release notes from CHANGELOG-FORK.md
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.pkg }}"
          python3 - "$VERSION" > release-notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG-FORK.md").read()
          m = re.search(rf"(?m)^##\s+{re.escape(version)}\b.*?(?=^##\s|\Z)", text, re.S)
          if not m:
              # If no specific version found, use a generic message
              print(f"WASM release v{version}")
          else:
              print(m.group(0).split("\n", 1)[1].strip())
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Idempotent: re-running the workflow on an existing tag updates the release
      # rather than erroring out. A `-`-bearing version (0.7.6-beta1) is a prerelease.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.notes.outputs.version }}"
          TAG="wasm-v$VERSION"
          case "$VERSION" in
            *-*) FLAGS=(--prerelease) ;;
            *)   FLAGS=(--latest) ;;
          esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — updating notes and uploading asset."
            gh release edit "$TAG" --notes-file release-notes.md "${FLAGS[@]}"
            gh release upload "$TAG" cozo-lib-wasm-${VERSION}.tar.gz --clobber
          else
            echo "Creating release $TAG."
            gh release create "$TAG" --title "$TAG" --notes-file release-notes.md "${FLAGS[@]}"
            gh release upload "$TAG" cozo-lib-wasm-${VERSION}.tar.gz
          fi
