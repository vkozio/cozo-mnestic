[workspace]
resolver = "2"
members = [
    "cozo-core",
    "cozorocks",
    "cozo-bin",
    "cozo-core-examples",
]
# Language bindings are deferred in the mnestic fork — the fork targets a Rust
# agentic-memory substrate (consumed by mindgraph-rs). The binding crates are
# kept in-tree but excluded from the workspace build/maintenance for now.
exclude = [
    "cozo-lib-c",
    "cozo-lib-java",
    "cozo-lib-wasm",
    "cozo-lib-wasm-next",
    "cozo-lib-swift",
    "cozo-lib-python",
    "cozo-lib-nodejs",
]

[profile.bench]
lto = true
debug = true

[profile.dev.package."mnestic-rocks"]
opt-level = 3

# Graph stack from the mnestic fork (vkozio/graph@mnestic/wasm.1, same
# versions: graph 0.3.2 / graph_builder 0.4.2, MIT). The fork carries the
# wasm fixes (no-op Timer, par_scope fallback, Csr::empty()) and outgrew the
# rayon-1.11 `edges()` breakage that crates.io graph_builder 0.4.1 still
# has — without this patch the stable build cannot use rayon >= 1.11.
# Host code paths are bit-identical to upstream (fork suite: 122 green).
# cozo-lib-wasm-next carries the same patch in its own manifest (own lock).
[patch.crates-io]
graph = { git = "https://github.com/vkozio/graph.git", tag = "mnestic/wasm.1" }
graph_builder = { git = "https://github.com/vkozio/graph.git", tag = "mnestic/wasm.1" }
